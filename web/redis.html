<!--
web/redis.html
页面功能：Redis 监控面板调试页，轮询 /api/redis/keys 实时查看全部 Key 的类型、TTL 与 JSON 值，展示 Key 总数与计费相关统计，支持自动刷新、模式筛选与关键字查找。
依赖接口/资源：Layui CDN、theme.js；/api/redis/keys。
安全边界：页面仅用于本地开发调试，不承载生产鉴权逻辑；Redis 值可能包含用户数据，仅限本地环境查看，不对外暴露。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TozoAI Redis 监控面板</title>
    <!-- Layui 样式资源 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <script src="/web/theme.js?v=20260607-theme" defer></script>
    <style>
        body { background: #f2f2f2; padding: 15px; }
        .header-bar {
            background: #fff; padding: 15px 20px; margin-bottom: 15px;
            border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.05);
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-bar h2 { margin: 0; font-size: 20px; color: #333; }
        .header-bar .subtitle { color: #999; font-size: 13px; margin-left: 12px; }
        .stats-bar {
            display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .stat-card {
            background: #fff; padding: 12px 20px; border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,.05); flex: 1 1 150px; text-align: center;
        }
        .stat-card .num { font-size: 28px; font-weight: 600; color: #1E9FFF; }
        .stat-card .label { font-size: 12px; color: #999; margin-top: 4px; }
        .table-wrap {
            background: #fff; padding: 15px; border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }
        .toolbar { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        /* JSON 值展示 */
        .json-value {
            max-height: 620px; overflow-y: auto;
            font-family: 'Cascadia Code', 'Consolas', monospace;
            font-size: 12px; white-space: pre-wrap; word-break: break-all;
            background: #f8f8f8; padding: 6px 8px; border-radius: 3px; border: 1px solid #e8e8e8;
        }
        .type-badge {
            display: inline-block; padding: 2px 8px; border-radius: 3px;
            font-size: 12px; color: #fff; font-weight: 500;
        }
        .type-string { background: #5FB878; }
        .type-hash   { background: #1E9FFF; }
        .type-list   { background: #FFB800; }
        .type-set    { background: #FF5722; }
        .type-zset   { background: #a233c6; }
        .type-unknown { background: #999; }
        .ttl-expire { color: #FF5722; font-weight: 600; }
        .ttl-persist { color: #5FB878; }
        .auto-refresh-indicator {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            margin-right: 4px; vertical-align: middle;
        }
        .auto-refresh-indicator.on  { background: #5FB878; animation: blink 1s infinite; }
        .auto-refresh-indicator.off { background: #ccc; }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        .nav-link { margin-left: 15px; }
        .key-desc { font-size: 12px; color:#666; line-height:1.5; }
        .billing-panel {
            background:#fff; padding:15px; border-radius:4px; margin-bottom:15px;
            box-shadow:0 1px 2px rgba(0,0,0,.05);
        }
        .billing-panel h3 { margin:0 0 10px; font-size:16px; color:#333; }
        .billing-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px; }
        .billing-card { border:1px solid #eee; border-radius:4px; padding:10px; background:#fafafa; }
        .billing-card .value { font-size:20px; font-weight:600; color:#1E9FFF; }
        .billing-card .name { font-size:12px; color:#777; margin-top:4px; }
        .mini-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
        .mini-table th, .mini-table td { border:1px solid #eee; padding:6px 8px; text-align:left; vertical-align:top; }
        .mini-table th { background:#f7f7f7; color:#555; }
        .mini-table code { font-size:11px; word-break:break-all; }
    </style>
</head>
<body>

<!-- 顶部 -->
<div class="header-bar">
    <div style="display:flex;align-items:baseline;">
        <h2>Redis 监控面板</h2>
        <span class="subtitle">实时查看 Redis 中所有 Key 数据</span>
    </div>
    <div>
        <a href="/web/" target="_blank" rel="noopener noreferrer" class="layui-btn layui-btn-sm layui-btn-primary nav-link">WS 测试面板</a>
        <a href="/web/chat.html" target="_blank" rel="noopener noreferrer" class="layui-btn layui-btn-sm layui-btn-primary nav-link">聊天看板</a>
        <a href="/web/audio.html" target="_blank" rel="noopener noreferrer" class="layui-btn layui-btn-sm layui-btn-primary nav-link">语音测试</a>
        <a href="/web/diagnostics.html" target="_blank" rel="noopener noreferrer" class="layui-btn layui-btn-sm layui-btn-primary nav-link">诊断看板</a>
        <a href="/web/responses.html" target="_blank" rel="noopener noreferrer" class="layui-btn layui-btn-sm layui-btn-primary nav-link">Responses 测试</a>
        <a href="/web/azure.html" target="_blank" rel="noopener noreferrer" class="layui-btn layui-btn-sm layui-btn-primary nav-link">Azure 监控</a>
    </div>
</div>

<!-- 统计卡片 -->
<div class="stats-bar">
    <div class="stat-card">
        <div class="num" id="stat-total">0</div>
        <div class="label">Key 总数</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-string">0</div>
        <div class="label">String</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-hash">0</div>
        <div class="label">Hash</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-other">0</div>
        <div class="label">List/Set/ZSet</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-last-update">-</div>
        <div class="label">最后刷新</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-session">0</div>
        <div class="label">Session Key</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-billing">0</div>
        <div class="label">Billing/Usage</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-rate">0</div>
        <div class="label">Rate Limit</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-openai">0</div>
        <div class="label">OpenAI/Realtime</div>
    </div>
</div>

<!-- Billing 明细区 -->
<div class="billing-panel">
    <h3>Billing Token 明细</h3>
    <div class="billing-grid" id="billing-summary">
        <div class="billing-card"><div class="value">0</div><div class="name">等待 Redis 数据</div></div>
    </div>
    <div id="billing-detail">暂无 billing 明细。建议先用 WS 面板完成一次 OpenAI response.done，再刷新 Redis。</div>
</div>

<!-- 表格区 -->
<div class="table-wrap">
    <div class="toolbar">
        <div class="layui-input-inline" style="width:190px;">
            <select id="pattern-preset" class="layui-input layui-input-sm">
                <option value="*">全部 key（*）</option>
                <option value="session:*">Session</option>
                <option value="billing:*">Billing 全部</option>
                <option value="billing:response:*">Billing response 明细</option>
                <option value="billing:daily*">Billing daily 汇总</option>
                <option value="rate_limit*">Rate Limit</option>
                <option value="*openai*">OpenAI / Realtime</option>
                <option value="custom">自定义模式</option>
            </select>
        </div>
        <div class="layui-input-inline" style="width:250px;">
            <input type="text" id="filter-pattern" value="*" placeholder="匹配模式（如 session:*）"
                   class="layui-input layui-input-sm">
        </div>
        <div class="layui-input-inline" style="width:150px;">
            <select id="category-filter" class="layui-input layui-input-sm">
                <option value="all">全部分类</option>
                <option value="session">session</option>
                <option value="billing">billing</option>
                <option value="rate_limit">rate_limit</option>
                <option value="openai">openai</option>
                <option value="auth">auth</option>
                <option value="other">other</option>
            </select>
        </div>
        <div class="layui-input-inline" style="width:280px;">
            <select id="key-select" class="layui-input layui-input-sm">
                <option value="">选择已扫描到的 key</option>
            </select>
        </div>
        <button class="layui-btn layui-btn-sm" id="btn-refresh">
            <i class="layui-icon layui-icon-refresh"></i> 刷新
        </button>
        <div class="layui-input-inline" style="width:120px;">
            <select id="auto-interval" class="layui-input layui-input-sm">
                <option value="0">关闭自动刷新</option>
                <option value="3" selected>3 秒</option>
                <option value="5">5 秒</option>
                <option value="10">10 秒</option>
                <option value="30">30 秒</option>
            </select>
        </div>
        <span id="auto-status">
            <span class="auto-refresh-indicator on"></span> 自动刷新中 (<span id="auto-countdown">3</span>s)
        </span>
    </div>

    <table id="redis-table" lay-filter="redisTable"></table>
</div>

<!-- Layui 脚本资源 -->
<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script>
/**
 * TozoAI Redis 监控面板
 * 功能：
 *   1. 定时轮询 /api/redis/keys 接口获取 Redis 所有 key 数据
 *   2. 使用 Layui table 展示（key / type / ttl / value）
 *   3. value 以 JSON 格式展示
 *   4. 支持自定义匹配模式和自动刷新间隔
 */

// 全局状态
let autoTimer = null;
let countdown = 3;
let allData = [];

layui.use(['table', 'form'], function() {
    const table = layui.table;
    const $ = layui.$;

    const redisColumns = [[
        { field: 'key', title: 'Key', width: 320, sort: true, templet: function(d) {
            return '<span style="font-family:monospace;font-size:13px;word-break:break-all;">' + escapeHtml(d.key) + '</span>';
        }},
        { field: 'type', title: '类型', width: 90, align: 'center', sort: true, templet: function(d) {
            const cls = 'type-' + (d.type || 'unknown');
            return '<span class="type-badge ' + cls + '">' + (d.type || '-') + '</span>';
        }},
        { field: 'ttl', title: 'TTL', width: 100, align: 'center', sort: true, templet: function(d) {
            if (d.ttl === -1) return '<span class="ttl-persist">永不过期</span>';
            if (d.ttl === -2) return '<span class="ttl-expire">已过期</span>';
            return formatTTL(d.ttl);
        }},
        { field: 'category', title: 'Key 作用', width: 150, sort: true, templet: function(d) {
            return '<b>' + escapeHtml(d.category || 'other') + '</b>';
        }},
        { field: 'description', title: '作用解释', minWidth: 260, templet: function(d) {
            return '<div class="key-desc">' + escapeHtml(d.description || '-') + '</div>';
        }},
        { field: 'value', title: '脱敏值预览（JSON）', minWidth: 520, templet: function(d) {
            const display = typeof d.value === 'object' && d.value !== null
                ? JSON.stringify(d.value, null, 2)
                : String(d.value);
            const safe = d.value_safe ? '<div class="key-desc">敏感字段已脱敏，只保留运营排障所需摘要。</div>' : '';
            return safe + '<div class="json-value">' + escapeHtml(display) + '</div>';
        }}
    ]];

    table.render({
        elem: '#redis-table',
        id: 'redisTableInst',
        cols: redisColumns,
        data: [],
        page: false,
        skin: 'line',
        even: true,
        size: 'sm',
        text: { none: '暂无 Redis 数据，请确保 Go 服务和 Redis 已启动' }
    });

    function renderTable(data) {
        table.reload('redisTableInst', {
            data: data,
            text: { none: '暂无 Redis 数据' }
        });
    }

    function refreshData() {
        const pattern = $('#filter-pattern').val() || '*';
        const apiUrl = '/api/redis/keys?pattern=' + encodeURIComponent(pattern) + '&count=1000&full=1';

        $.ajax({
            url: apiUrl,
            type: 'GET',
            dataType: 'json',
            timeout: 5000,
            success: function(res) {
                if (res.code !== 200) {
                    layui.layer.msg('获取失败: ' + (res.error || '未知错误'), {icon: 2});
                    return;
                }
                allData = res.data || [];
                updateKeySelect(allData);
                applyClientFilters();
                renderBillingPanel(allData);
            },
            error: function(xhr, status, error) {
                console.error('Redis API 请求失败:', status, error);
            }
        });
    }

    function applyClientFilters() {
        const category = $('#category-filter').val() || 'all';
        const visibleData = category === 'all'
            ? allData
            : allData.filter(item => (item.category || 'other') === category);
        renderTable(visibleData);
        updateStats(visibleData);
    }

    function updateKeySelect(data) {
        const select = $('#key-select');
        const current = select.val();
        select.empty();
        select.append('<option value="">选择已扫描到的 key</option>');
        data.slice().sort((a, b) => String(a.key).localeCompare(String(b.key))).forEach(item => {
            select.append('<option value="' + escapeAttr(item.key) + '">' + escapeHtml(item.key) + '</option>');
        });
        if (current && data.some(item => item.key === current)) {
            select.val(current);
        }
    }

    function updateStats(data) {
        let stringCount = 0, hashCount = 0, otherCount = 0;
        let sessionCount = 0, billingCount = 0, rateCount = 0, openaiCount = 0;
        data.forEach(function(item) {
            switch (item.type) {
                case 'string': stringCount++; break;
                case 'hash': hashCount++; break;
                default: otherCount++; break;
            }
            const category = item.category || '';
            if (category === 'session') sessionCount++;
            else if (category === 'billing') billingCount++;
            else if (category === 'rate_limit') rateCount++;
            else if (category === 'openai') openaiCount++;
        });
        $('#stat-total').text(data.length);
        $('#stat-string').text(stringCount);
        $('#stat-hash').text(hashCount);
        $('#stat-other').text(otherCount);
        $('#stat-session').text(sessionCount);
        $('#stat-billing').text(billingCount);
        $('#stat-rate').text(rateCount);
        $('#stat-openai').text(openaiCount);
        $('#stat-last-update').text(new Date().toLocaleTimeString());
    }

    function renderBillingPanel(data) {
        const billingKeys = data.filter(item => item.category === 'billing' || String(item.key).startsWith('billing:'));
        const responseRows = billingKeys.filter(item => String(item.key).startsWith('billing:response:'));
        const dailyDetailRows = billingKeys.filter(item => String(item.key).startsWith('billing:daily_detail:'));
        const dailyRows = billingKeys.filter(item => String(item.key).startsWith('billing:daily:'));
        const sessionRows = billingKeys.filter(item => /^billing:[^:]+:[^:]+$/.test(item.key));

        const summary = summarizeBilling(responseRows, dailyDetailRows, sessionRows, dailyRows);
        $('#billing-summary').html([
            billingCard(summary.totalTokens, '总 token'),
            billingCard(summary.inputTokens, '输入 token'),
            billingCard(summary.outputTokens, '输出 token'),
            billingCard(summary.inputTextTokens + '/' + summary.inputAudioTokens, '输入 text/audio'),
            billingCard(summary.outputTextTokens + '/' + summary.outputAudioTokens, '输出 text/audio'),
            billingCard(responseRows.length, 'responseId 明细条数')
        ].join(''));

        const html = [
            '<h3>每次 responseId 汇总</h3>',
            buildResponseBillingTable(responseRows),
            '<h3 style="margin-top:14px;">Daily 汇总</h3>',
            buildDailyBillingTable(dailyDetailRows, dailyRows),
            '<h3 style="margin-top:14px;">Session 汇总</h3>',
            buildSessionBillingTable(sessionRows)
        ].join('');
        $('#billing-detail').html(html);
    }

    function summarizeBilling(responseRows, dailyDetailRows, sessionRows, dailyRows) {
        const sourceRows = dailyDetailRows.length ? dailyDetailRows : (responseRows.length ? responseRows : sessionRows);
        const summary = {
            inputTokens: 0, outputTokens: 0, totalTokens: 0,
            inputTextTokens: 0, inputAudioTokens: 0,
            outputTextTokens: 0, outputAudioTokens: 0
        };
        sourceRows.forEach(item => {
            const v = valueObject(item);
            summary.inputTokens += intValue(v.input_tokens);
            summary.outputTokens += intValue(v.output_tokens);
            summary.totalTokens += intValue(v.total_tokens);
            summary.inputTextTokens += intValue(v.input_text_tokens);
            summary.inputAudioTokens += intValue(v.input_audio_tokens);
            summary.outputTextTokens += intValue(v.output_text_tokens);
            summary.outputAudioTokens += intValue(v.output_audio_tokens);
        });
        if (!summary.totalTokens && dailyRows.length) {
            summary.totalTokens = dailyRows.reduce((sum, item) => sum + intValue(item.value), 0);
        }
        return summary;
    }

    function buildResponseBillingTable(rows) {
        if (!rows.length) return '<div class="key-desc">暂无 billing:response:* 明细；旧数据可能只有 session 汇总，没有 responseId 维度。</div>';
        return '<table class="mini-table"><thead><tr><th>responseId</th><th>session</th><th>token</th><th>text/audio</th><th>来源</th></tr></thead><tbody>' +
            rows.slice().reverse().map(item => {
                const v = valueObject(item);
                return '<tr>' +
                    '<td><code>' + escapeHtml(v.response_id || lastPart(item.key)) + '</code></td>' +
                    '<td><code>' + escapeHtml(v.session_id || keyPart(item.key, 3)) + '</code></td>' +
                    '<td>输入 ' + intValue(v.input_tokens) + '<br>输出 ' + intValue(v.output_tokens) + '<br>总量 ' + intValue(v.total_tokens) + '</td>' +
                    '<td>输入 text/audio：' + intValue(v.input_text_tokens) + ' / ' + intValue(v.input_audio_tokens) + '<br>输出 text/audio：' + intValue(v.output_text_tokens) + ' / ' + intValue(v.output_audio_tokens) + '</td>' +
                    '<td>' + escapeHtml(v.detail_source || v.token_detail_source || '未知') + '</td>' +
                    '</tr>';
            }).join('') + '</tbody></table>';
    }

    function buildDailyBillingTable(detailRows, totalRows) {
        if (!detailRows.length && !totalRows.length) return '<div class="key-desc">暂无 billing:daily:* 或 billing:daily_detail:* 汇总。</div>';
        const detailHTML = detailRows.map(item => {
            const v = valueObject(item);
            return '<tr><td><code>' + escapeHtml(item.key) + '</code></td><td>' + intValue(v.response_count) + '</td><td>' + intValue(v.total_tokens) + '</td><td>' + intValue(v.input_text_tokens) + '/' + intValue(v.input_audio_tokens) + '</td><td>' + intValue(v.output_text_tokens) + '/' + intValue(v.output_audio_tokens) + '</td></tr>';
        }).join('');
        const totalHTML = totalRows.map(item => '<tr><td><code>' + escapeHtml(item.key) + '</code></td><td>-</td><td>' + intValue(item.value) + '</td><td>-</td><td>-</td></tr>').join('');
        return '<table class="mini-table"><thead><tr><th>daily key</th><th>response 数</th><th>总 token</th><th>输入 text/audio</th><th>输出 text/audio</th></tr></thead><tbody>' + detailHTML + totalHTML + '</tbody></table>';
    }

    function buildSessionBillingTable(rows) {
        if (!rows.length) return '<div class="key-desc">暂无 billing:{model}:{sessionID} 汇总。</div>';
        return '<table class="mini-table"><thead><tr><th>session key</th><th>response 数</th><th>token</th><th>text/audio</th><th>last response</th></tr></thead><tbody>' +
            rows.map(item => {
                const v = valueObject(item);
                return '<tr><td><code>' + escapeHtml(item.key) + '</code></td><td>' + intValue(v.response_count) + '</td><td>输入 ' + intValue(v.input_tokens) + '<br>输出 ' + intValue(v.output_tokens) + '<br>总量 ' + intValue(v.total_tokens) + '</td><td>输入 ' + intValue(v.input_text_tokens) + '/' + intValue(v.input_audio_tokens) + '<br>输出 ' + intValue(v.output_text_tokens) + '/' + intValue(v.output_audio_tokens) + '</td><td><code>' + escapeHtml(v.last_response_id || '-') + '</code></td></tr>';
            }).join('') + '</tbody></table>';
    }

    function billingCard(value, name) {
        return '<div class="billing-card"><div class="value">' + escapeHtml(String(value)) + '</div><div class="name">' + escapeHtml(name) + '</div></div>';
    }

    $('#btn-refresh').on('click', function() {
        refreshData();
        layui.layer.msg('已刷新', {icon: 1, time: 800});
    });
    $('#pattern-preset').on('change', function() {
        const value = $(this).val();
        if (value !== 'custom') {
            $('#filter-pattern').val(value);
            refreshData();
        }
    });
    $('#category-filter').on('change', applyClientFilters);
    $('#key-select').on('change', function() {
        const key = $(this).val();
        if (key) {
            $('#pattern-preset').val('custom');
            $('#filter-pattern').val(key);
            refreshData();
        }
    });
    $('#filter-pattern').on('keydown', function(event) {
        if (event.key === 'Enter') {
            $('#pattern-preset').val('custom');
            refreshData();
        }
    });

    function startAutoRefresh() {
        stopAutoRefresh();
        const interval = parseInt($('#auto-interval').val());
        if (interval <= 0) {
            $('#auto-status').html('<span class="auto-refresh-indicator off"></span> 自动刷新已关闭');
            return;
        }
        countdown = interval;
        updateCountdown();
        autoTimer = setInterval(function() {
            countdown--;
            if (countdown <= 0) {
                refreshData();
                countdown = interval;
            }
            updateCountdown();
        }, 1000);
    }

    function stopAutoRefresh() {
        if (autoTimer) {
            clearInterval(autoTimer);
            autoTimer = null;
        }
    }

    function updateCountdown() {
        const interval = parseInt($('#auto-interval').val());
        if (interval <= 0) {
            $('#auto-status').html('<span class="auto-refresh-indicator off"></span> 自动刷新已关闭');
        } else {
            $('#auto-status').html('<span class="auto-refresh-indicator on"></span> 自动刷新中 (<span id="auto-countdown">' + countdown + '</span>s)');
        }
    }

    $('#auto-interval').on('change', startAutoRefresh);

    refreshData();
    startAutoRefresh();
});

// 工具函数
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function escapeAttr(text) {
    return escapeHtml(text).replace(/"/g, '&quot;');
}

function valueObject(item) {
    return item && typeof item.value === 'object' && item.value !== null ? item.value : {};
}

function intValue(value) {
    const n = parseInt(value || 0, 10);
    return Number.isFinite(n) ? n : 0;
}

function keyPart(key, index) {
    return String(key || '').split(':')[index] || '';
}

function lastPart(key) {
    const parts = String(key || '').split(':');
    return parts[parts.length - 1] || '';
}

function formatTTL(seconds) {
    if (seconds < 60) return seconds + 's';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return h + 'h ' + m + 'm';
}
