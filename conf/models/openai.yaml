# conf/models/openai.yaml
# OpenAI Realtime API 特定模型配置文件。
# API Key 必须通过 OPENAI_API_KEY 环境变量注入，避免推送到 GitHub 时泄漏密钥。

enabled: true
api_key: "${OPENAI_API_KEY}"
# default_model 由 conf/config.yaml 的 models.openai.default_model 作为更高优先级覆盖。
default_model: "gpt-realtime"
instructions: "你是一个智能助手，帮助用户解决问题"
voice: "alloy"
rate_rps: 10
rate_burst: 20
max_session_ttl: 3600
organization: ""
extra:
  # function_call 工具执行超时，避免天气/地图/知识库供应商卡住 Realtime 会话。
  tool_timeout_ms: 8000
  # OpenWeather：配置 API Key 后 get_open_weather 会真实调用 OpenWeather。
  open_weather_api_key: "${OPEN_WEATHERMAP_API_KEY}"
  open_weather_endpoint: "https://api.openweathermap.org/data/2.5"
  # TOZO 知识库：可配置自建检索接口，或配置 OpenAI Vector Store ID 走官方检索接口。
  tozo_knowledge_endpoint: "${TOZO_KNOWLEDGE_ENDPOINT}"
  tozo_knowledge_api_key: "${TOZO_KNOWLEDGE_API_KEY}"
  tozo_vector_store_id: "${TOZO_VECTOR_STORE_ID}"
  tozo_knowledge_max_results: 3
  # 地图导航：当前 Go 侧已实现 Mapbox 执行器；Amap/Google 保留同名配置位后续扩展。
  default_map_sdk: "mapbox"
  mapbox_api_key: "${MAPBOX_MAP_API_KEY}"
  mapbox_endpoint: "https://api.mapbox.com/search/searchbox/v1"

# OpenAI Realtime 专属配置。
realtime:
  ws_url: "wss://api.openai.com/v1/realtime"
  reconnect_max_retries: 3
  reconnect_delay: "1s"
  # App↔Go 心跳配置。
  app_ping_interval: "30s"
  app_pong_timeout: "60s"
  # Go↔OpenAI 心跳与读写超时配置。
  api_read_timeout: "120s"
  api_ping_interval: "30s"
  api_pong_timeout: "90s"
  api_write_timeout: "10s"
  # OpenAI 重连后的最小会话恢复策略。
  restore_session: true
  restore_history_limit: 32
  send_queue_timeout_ms: 250
  # 上游拨号代理（可选）。留空时使用 HTTPS_PROXY / HTTP_PROXY 环境变量；
  # 显式配置后强制走该代理，国内开发机无法直连 api.openai.com 时直接在这里指定 Clash / V2Ray 监听端口即可，
  # 无需重启 GoLand 或修改用户级环境变量。支持 http://、https://、socks5://。
  # 示例：proxy_url: "http://127.0.0.1:7890"
  proxy_url: ""
