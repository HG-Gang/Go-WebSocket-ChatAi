# conf/config_prod.yaml
# 生产环境配置覆盖
# 针对生产部署的安全性和性能优化。

env: prod

server:
  addr: ":443"       # 生产环境通常监听 HTTPS 443 端口
  mode: release      # 切换至 Release 模式，关闭 Gin 的调试日志

redis:
  addr: ""           # 生产 Redis 地址（建议通过环境变量或内网 DNS 配置）
  password: ""       # 生产 Redis 密码（必须加密或通过 Secret 注入）

jwt:
  enabled: true
  secret: ""         # 生产密钥严禁提交至代码库，应通过环境变量注入

security:
  public_debug_enabled: false
  public_token_enabled: false
  allowed_origins: []
  trusted_proxies: []
  allow_upstream_query_key: false
  workspace_write_confirm: true
  workspace_audit_retention_days: 180

logs:
  root_dir: "./logs"
  retention_days: 180       # 生产默认保留 180 天按天日志，满足审计追溯窗口
  cleanup_interval: "24h"   # 每天执行一次日志清理

rate_limit:
  enabled: true       # 生产环境必须开启限流保护

billing:
  enabled: true       # 生产环境开启计费统计
